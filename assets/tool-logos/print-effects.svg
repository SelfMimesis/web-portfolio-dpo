<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="orange-tones" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values=".021 .072 .007 0 .86  .138 .465 .047 0 .21  .149 .501 .05 0 .06  0 0 0 1 0"/>
  </filter>
  <filter id="inkbleed" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".075 .12" numOctaves="3" seed="9" result="fibres"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius=".32" result="spread"/>
    <feDisplacementMap in="spread" in2="fibres" scale="1.35" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation=".18"/>
  </filter>
</svg>
